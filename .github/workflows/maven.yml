# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Selenium Test Automation Framework Creation Workflow

on:
  schedule:
    - cron: 00 18 * * *
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        
    - name: running automated tests with Maven
      run: mvn test -X -Dbrowser=chrome -DisLambdaTest=false -DisHeadless=true

    - name: upload test logs
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: Test Logs
        path: logs/
        
    - name: upload screenshots as artifacts
      if: always()
      uses: actions/upload-artifact@v4.4.3
      with:
        name: screenshots
        path: screenshots/
        if-no-files-found: ignore
        
    - name: upload test reports
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: Test Reports
        path: report.html

    - name: test execution status
      run: echo "Test Execution Completed"

    - name: copy report to gh-pages folder
      if: ${{ always() && github.event_name != 'pull_request' }}
      run: |
        mkdir -p public/extent-reports
        if [ -f report.html ]; then
          cp report.html public/extent-reports/index.html
          cp report.html public/extent-reports/report.html
        else
          echo "<html><body><h1>Extent report was not generated</h1></body></html>" > public/extent-reports/index.html
        fi
        if [ -d screenshots ]; then
          cp -R screenshots public/extent-reports/screenshots
        fi
        find public/extent-reports -maxdepth 2 -type f -print

    - name: deploy
      if: ${{ always() && github.event_name != 'pull_request' }}
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: public/extent-reports/
        token: ${{ secrets.GITHUB_TOKEN }}
        clean: true
    
         

    
